name: Release MCP metadata

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build and verify MCP metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify tag targets public main
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo "Release tag must target the current public main commit." >&2
            exit 1
          }
      - name: Validate MCP metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 scripts/verify-client-artifacts.py --source . --source-kind mcp
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("server.json").read_text())
          expected_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if metadata["version"] != expected_version:
              raise SystemExit(
                  f"server.json version {metadata['version']!r} does not match {expected_version!r}"
              )
          PY
          mkdir release-assets
          cp server.json release-assets/
          (cd release-assets && sha256sum server.json > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-metadata
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attest and create GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # Create or verify the immutable GitHub Release
      id-token: write # OIDC for the Sigstore attestation
      attestations: write # Publish the GitHub artifact attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcp-metadata
          path: release-assets
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-assets/server.json
      - name: Create or verify release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)" == "false" ]]; then
            mkdir existing
            gh release download "$GITHUB_REF_NAME" --dir existing
            diff <(sha256sum release-assets/* | sed 's#release-assets/##') <(sha256sum existing/* | sed 's#existing/##')
          else
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
              gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "MCP metadata $GITHUB_REF_NAME" --generate-notes
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --verify-tag
          fi
